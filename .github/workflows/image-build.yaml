name: Image build

on:
  workflow_call:
    inputs:
      image:
        description: 'Name of the image directory under images/ to build'
        required: true
        type: string
      mode:
        description: 'Build mode: pr (per-leg digest push, surfaces pull command) or release (per-leg digest push, merge job assembles manifest list)'
        required: true
        type: string
      platform:
        description: 'Platform to build for (e.g. linux/amd64, linux/arm64)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Read image metadata
        id: config
        # images/<app>/image.yaml drives OCI annotations.
        # Defaults: description/license empty when image.yaml is missing.
        run: |
          config="images/${{ inputs.image }}/image.yaml"
          arch="${{ inputs.platform }}"
          arch="${arch#linux/}"
          if [ -f "$config" ]; then
            description=$(yq --unwrapScalar '.description // ""' "$config")
            license=$(yq --unwrapScalar '.license // ""' "$config")
            build_args=$(yq --unwrapScalar ".buildArgs.${arch} // {} | to_entries | map(.key + \"=\" + .value) | .[]" "$config")
          else
            description=''
            license=''
            build_args=''
          fi
          {
            echo "description=${description}"
            echo "license=${license}"
            echo "source=${{ github.server_url }}/${{ github.repository }}"
            echo "build-args<<EOF"
            echo "$build_args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Slugify platform
        id: slug
        run: echo "value=$(echo '${{ inputs.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/${{ inputs.image }}
          platforms: ${{ inputs.platform }}
          build-args: ${{ steps.config.outputs.build-args }}
          outputs: type=image,"name=ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}",push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          # Manifest-level (per-image) OCI labels only. Index-level annotations belong on the
          # multi-arch manifest list and are written by build.yaml's merge job; emitting them
          # here breaks single-platform export with 'index annotations not supported'.
          labels: |
            org.opencontainers.image.source=${{ steps.config.outputs.source }}
            org.opencontainers.image.description=${{ steps.config.outputs.description }}
            org.opencontainers.image.licenses=${{ steps.config.outputs.license }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ inputs.platform }}
          provenance: false
      - name: Export digest as filename
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ inputs.image }}-${{ steps.slug.outputs.value }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Detect Trivy ignore file
        id: trivyignore
        run: |
          path="images/${{ inputs.image }}/.trivyignore"
          if [ -f "$path" ]; then
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          trivyignores: ${{ steps.trivyignore.outputs.path }}
      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-results.sarif
          category: ${{ inputs.image }}-${{ steps.slug.outputs.value }}
      - name: Trivy scan (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          output: trivy-critical.txt
          trivyignores: ${{ steps.trivyignore.outputs.path }}
          skip-setup-trivy: true
      - name: Surface CRITICAL findings on failure
        if: failure()
        run: |
          {
            echo "### Trivy CRITICAL findings for \`${{ inputs.image }}\` (${{ inputs.platform }})"
            echo
            echo '```'
            cat trivy-critical.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Surface pull command
        if: inputs.mode == 'pr'
        run: |
          {
            echo "### \`${{ inputs.image }}\`"
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
