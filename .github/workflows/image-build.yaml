name: Image build

on:
  workflow_call:
    inputs:
      image:
        description: 'Name of the image directory under images/ to build'
        required: true
        type: string
      mode:
        description: 'Build mode: pr (per-leg digest push, surfaces pull command) or release (per-leg digest push, merge job assembles manifest list)'
        required: true
        type: string
      platform:
        description: 'Platform to build for (e.g. linux/amd64, linux/arm64)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Read image metadata
        id: config
        # images/<app>/image.yaml drives OCI annotations.
        # Defaults: description/license empty when image.yaml is missing.
        run: |
          config="images/${{ inputs.image }}/image.yaml"
          if [ -f "$config" ]; then
            description=$(yq --unwrapScalar '.description // ""' "$config")
            license=$(yq --unwrapScalar '.license // ""' "$config")
          else
            description=''
            license=''
          fi
          {
            echo "description=${description}"
            echo "license=${license}"
            echo "source=${{ github.server_url }}/${{ github.repository }}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Slugify platform
        id: slug
        run: echo "value=$(echo '${{ inputs.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: images/${{ inputs.image }}
          platforms: ${{ inputs.platform }}
          outputs: type=image,"name=ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}",push-by-digest=true,name-canonical=true,push=true
          # Manifest-level (per-image) OCI labels only. Index-level annotations belong on the
          # multi-arch manifest list and are written by build.yaml's merge job; emitting them
          # here breaks single-platform export with 'index annotations not supported'.
          labels: |
            org.opencontainers.image.source=${{ steps.config.outputs.source }}
            org.opencontainers.image.description=${{ steps.config.outputs.description }}
            org.opencontainers.image.licenses=${{ steps.config.outputs.license }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ inputs.platform }}
          provenance: false
      - name: Resolve built digest
        id: digest
        run: echo "value=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Export digest as filename
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ inputs.image }}-${{ steps.slug.outputs.value }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Trivy scan (blocking on CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}@${{ steps.digest.outputs.value }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Surface pull command
        if: inputs.mode == 'pr'
        run: |
          {
            echo "### \`${{ inputs.image }}\`"
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}@${{ steps.digest.outputs.value }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
