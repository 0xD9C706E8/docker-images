name: Image build

on:
  workflow_call:
    inputs:
      image:
        description: 'Name of the image directory under images/ to build'
        required: true
        type: string
      mode:
        description: 'Build mode: pr (digest-only push, no tags) or release (semver-tagged push)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Read image metadata
        id: config
        # images/<app>/image.yaml drives platforms + OCI annotations.
        # Defaults: platforms = amd64+arm64; description/license empty.
        run: |
          config="images/${{ inputs.image }}/image.yaml"
          if [ -f "$config" ]; then
            platforms=$(yq --unwrapScalar '(.platforms // ["linux/amd64", "linux/arm64"]) | join(",")' "$config")
            description=$(yq --unwrapScalar '.description // ""' "$config")
            license=$(yq --unwrapScalar '.license // ""' "$config")
          else
            platforms='linux/amd64,linux/arm64'
            description=''
            license=''
          fi
          if printf '%s' "$description" | grep -q ','; then
            echo "::error file=${config}::description must not contain commas (breaks build-push-action outputs CSV)"
            exit 1
          fi
          {
            echo "platforms=${platforms}"
            echo "description=${description}"
            echo "license=${license}"
            echo "source=${{ github.server_url }}/${{ github.repository }}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Extract version
        id: version
        if: inputs.mode == 'release'
        run: |
          raw=$(grep -oP 'ARG \w+_VERSION=\K[^\s]+' images/${{ inputs.image }}/Dockerfile | head -1)
          version=$(echo "${raw#v}" | grep -oP '^\d+\.\d+\.\d+')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        if: inputs.mode == 'release'
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}
          tags: |
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ steps.config.outputs.source }}
            org.opencontainers.image.description=${{ steps.config.outputs.description }}
            org.opencontainers.image.licenses=${{ steps.config.outputs.license }}
          annotations: |
            org.opencontainers.image.source=${{ steps.config.outputs.source }}
            org.opencontainers.image.description=${{ steps.config.outputs.description }}
            org.opencontainers.image.licenses=${{ steps.config.outputs.license }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Build and push
        id: build-pr
        if: inputs.mode == 'pr'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: images/${{ inputs.image }}
          platforms: ${{ steps.config.outputs.platforms }}
          outputs: type=image,"name=ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}",push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.source=${{ steps.config.outputs.source }},annotation-index.org.opencontainers.image.description=${{ steps.config.outputs.description }},annotation-index.org.opencontainers.image.licenses=${{ steps.config.outputs.license }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
          provenance: false
      - name: Build and push
        id: build-release
        if: inputs.mode == 'release'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: images/${{ inputs.image }}
          platforms: ${{ steps.config.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
          provenance: false
      - name: Resolve built digest
        id: digest
        run: |
          if [ '${{ inputs.mode }}' = 'pr' ]; then
            echo "value=${{ steps.build-pr.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.build-release.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy scan (blocking on CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}@${{ steps.digest.outputs.value }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Surface pull command
        if: inputs.mode == 'pr'
        run: |
          {
            echo "### \`${{ inputs.image }}\`"
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ steps.owner.outputs.name }}/${{ inputs.image }}@${{ steps.digest.outputs.value }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
