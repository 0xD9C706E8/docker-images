name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install pre-commit
        run: pip install -r .github/requirements-ci.txt
      - name: Cache pre-commit hooks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.github/requirements-ci.txt') }}
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color always

  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
      include: ${{ steps.changed.outputs.include }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      # Triggers fan out to all images: PR checks depend on ci.yaml + the build/script chain
      - name: Detect changed images
        id: changed
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/detect-images.sh '.github/workflows/ci.yaml,.github/workflows/build.yaml,.github/workflows/image-build.yaml,.github/scripts/detect-images.sh'

  lint-renovate:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Validate Renovate annotations in ${{ matrix.image }}/Dockerfile
        run: bash .github/scripts/lint-renovate-annotations.sh "images/${{ matrix.image }}/Dockerfile"

  build:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.include) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      image: ${{ matrix.image }}
      mode: pr
      platform: ${{ matrix.platform }}

  ci-success:
    needs: [lint, detect, lint-renovate, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded or were skipped
        run: |
          for result in '${{ needs.lint.result }}' '${{ needs.detect.result }}' '${{ needs.lint-renovate.result }}' '${{ needs.build.result }}'; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::upstream job result was '$result'"; exit 1 ;;
            esac
          done
