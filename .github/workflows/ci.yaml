name: CI

on:
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/*.yaml'
      - '.pre-commit-config.yaml'
      - '.prettierrc.json'
      - '.yamllint.yaml'
      - '.hadolint.yaml'
      - 'renovate.json5'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.5'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Detect changed images
        id: changed
        run: |
          list_all_images() {
            if [ -d images ] && [ -n "$(ls -A images 2>/dev/null)" ]; then
              find images -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rc '[., inputs]'
            else
              echo '[]'
            fi
          }

          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'images/' '.github/workflows/build.yaml' '.github/workflows/ci.yaml')

          if echo "$changed" | grep -qE '\.github/workflows/(build|ci)\.yaml'; then
            images=$(list_all_images)
          else
            images=$(echo "$changed" | grep -oP 'images/\K[^/]+' | sort -u | jq -Rc '[., inputs]')
          fi

          echo "images=${images}" >> "$GITHUB_OUTPUT"
          if [ "$images" = "[]" ] || [ -z "$images" ]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

  lint-renovate:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate Renovate annotations in ${{ matrix.image }}/Dockerfile
        run: |
          file="images/${{ matrix.image }}/Dockerfile"
          if [ ! -f "$file" ]; then
            echo "::notice file=$file::Dockerfile does not exist; skipping"
            exit 0
          fi

          awk '
          BEGIN { rc = 0 }

          function fail(msg) {
              printf "::error file=%s,line=%d::%s\n", FILENAME, NR, msg
              rc = 1
          }

          /^[[:space:]]*#[[:space:]]*renovate:/ {
              if (match($0, /datasource=[^[:space:]]+/)) {
                  ann_ds = substr($0, RSTART + 11, RLENGTH - 11)
              } else {
                  ann_ds = ""
              }
              if (match($0, /depName=[^[:space:]]+/)) {
                  ann_dep = substr($0, RSTART + 8, RLENGTH - 8)
              } else {
                  ann_dep = ""
              }
              if (ann_ds == "") {
                  fail("renovate annotation missing datasource=")
              }
              if (ann_dep == "") {
                  fail("renovate annotation missing depName=")
              }
              has_ann = 1
              ann_consumed = 0
              next
          }

          # Blank line: an annotation followed by a blank line and only THEN by ARG *_VERSION=
          # is technically tolerated by the generic manager but we keep things uniform.
          /^[[:space:]]*$/ {
              if (has_ann && !ann_consumed) {
                  fail("blank line between # renovate: annotation and ARG *_VERSION=")
                  has_ann = 0
              }
              next
          }

          /^[[:space:]]*ARG[[:space:]]+[A-Za-z_][A-Za-z0-9_]*_VERSION=/ {
              if (!has_ann) {
                  fail("ARG *_VERSION= without preceding # renovate: annotation")
              } else {
                  ann_consumed = 1
                  has_ann = 0
              }
              next
          }

          # Any other line: an annotation that was followed by something that is
          # NOT an ARG *_VERSION= is a dangling annotation Renovate cannot match.
          {
              if (has_ann && !ann_consumed) {
                  fail("# renovate: annotation not followed by ARG *_VERSION= on the next non-blank line")
                  has_ann = 0
              }
          }

          END {
              if (has_ann && !ann_consumed) {
                  fail("# renovate: annotation at end of file with no following ARG *_VERSION=")
              }
              exit rc
          }
          ' "$file"

  build:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: images/${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

  ci-success:
    needs: [lint, detect, lint-renovate, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded or were skipped
        run: |
          for result in '${{ needs.lint.result }}' '${{ needs.detect.result }}' '${{ needs.lint-renovate.result }}' '${{ needs.build.result }}'; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::upstream job result was '$result'"; exit 1 ;;
            esac
          done
