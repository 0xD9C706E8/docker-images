name: Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build.yaml'
      - '.github/workflows/image-build.yaml'
      - '.github/scripts/**'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to build (e.g. pocket-id), or leave empty for all'
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.changed.outputs.include }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      # Triggers exclude ci.yaml: it gates PR checks but does not affect published artifacts
      - name: Detect changed images
        id: changed
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          WORKFLOW_DISPATCH_IMAGE: ${{ inputs.image }}
        run: bash .github/scripts/detect-images.sh '.github/workflows/build.yaml,.github/workflows/image-build.yaml,.github/scripts/detect-images.sh'

  build:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.include) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      image: ${{ matrix.image }}
      mode: release
      platform: ${{ matrix.platform }}

  merge:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Create multi-arch manifests
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          images_json='${{ needs.build.outputs.image }}'
          platforms_json='${{ needs.build.outputs.platform }}'
          digests_json='${{ needs.build.outputs.digest }}'
          versions_json='${{ needs.build.outputs.version }}'

          combined=$(jq -n \
            --argjson images "$images_json" \
            --argjson platforms "$platforms_json" \
            --argjson digests "$digests_json" \
            --argjson versions "$versions_json" \
            '[ [images, platforms, digests, versions] | transpose | .[] | {image: .[0], platform: .[1], digest: .[2], version: .[3]} ]')

          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')

          echo "$combined" | jq -c 'group_by(.image)[]' | while read -r group; do
            image=$(echo "$group" | jq -r '.[0].image')
            version=$(echo "$group" | jq -r '.[0].version')
            name="ghcr.io/${owner}/${image}"

            # Read per-image OCI metadata (description/license) for index-level annotations
            config="images/${image}/image.yaml"
            description=$(yq --unwrapScalar '.description // ""' "$config")
            license=$(yq --unwrapScalar '.license // ""' "$config")

            refs=$(echo "$group" | jq -r '.[].digest' | sed "s|^|${name}@|")

            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f1,2)

            # Create manifest list with all tags + index-level OCI annotations.
            # Index annotations live on the manifest list, not single-platform images;
            # build-push-action cannot emit them safely from per-leg builds.
            # shellcheck disable=SC2086
            docker buildx imagetools create \
              -t "${name}:latest" \
              -t "${name}:${major}" \
              -t "${name}:${minor}" \
              -t "${name}:${version}" \
              --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
              --annotation "index:org.opencontainers.image.description=${description}" \
              --annotation "index:org.opencontainers.image.licenses=${license}" \
              $refs
          done
