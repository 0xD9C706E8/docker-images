name: Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build.yaml'
      - '.github/workflows/image-build.yaml'
      - '.github/scripts/**'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to build (e.g. pocket-id), or leave empty for all'
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.changed.outputs.include }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      # Triggers exclude ci.yaml: it gates PR checks but does not affect published artifacts
      - name: Detect changed images
        id: changed
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          WORKFLOW_DISPATCH_IMAGE: ${{ inputs.image }}
        run: bash .github/scripts/detect-images.sh '.github/workflows/build.yaml,.github/workflows/image-build.yaml,.github/scripts/detect-images.sh'

  build:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.include) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      image: ${{ matrix.image }}
      mode: release
      platform: ${{ matrix.platform }}

  merge:
    needs: [detect, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
      - name: Create multi-arch manifests
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          INCLUDE: ${{ needs.detect.outputs.include }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')

          echo "$INCLUDE" | jq -c 'group_by(.image)[]' | while read -r group; do
            image=$(echo "$group" | jq -r '.[0].image')
            name="ghcr.io/${owner}/${image}"

            # images/<image>/Dockerfile is the source of truth for version.
            # ARG <APP>_VERSION=<value> with the value being a semver, optionally v-prefixed.
            raw=$(grep -oP 'ARG \w+_VERSION=\K\S+' "images/${image}/Dockerfile" | head -1)
            version=$(echo "${raw#v}" | grep -oP '^\d+\.\d+\.\d+')
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f1,2)

            config="images/${image}/image.yaml"
            if [ -f "$config" ]; then
              description=$(yq --unwrapScalar '.description // ""' "$config")
              license=$(yq --unwrapScalar '.license // ""' "$config")
            else
              description=''
              license=''
            fi

            refs=()
            while IFS= read -r platform; do
              slug=$(echo "$platform" | tr '/' '-')
              # download-artifact preserves per-artifact subdirs; one digest file per leg.
              for digest_file in "${DIGESTS_DIR}/digests-${image}-${slug}"/*; do
                refs+=("${name}@sha256:$(basename "$digest_file")")
              done
            done < <(echo "$group" | jq -r '.[].platform')

            annotations=(--annotation "index:org.opencontainers.image.source=${SOURCE_URL}")
            [ -n "$description" ] && annotations+=(--annotation "index:org.opencontainers.image.description=${description}")
            [ -n "$license" ] && annotations+=(--annotation "index:org.opencontainers.image.licenses=${license}")

            docker buildx imagetools create \
              -t "${name}:latest" \
              -t "${name}:${major}" \
              -t "${name}:${minor}" \
              -t "${name}:${version}" \
              "${annotations[@]}" \
              "${refs[@]}"
          done
