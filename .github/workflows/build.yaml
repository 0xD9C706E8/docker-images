name: Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build.yaml'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to build (e.g. pocket-id), or leave empty for all'
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - name: Detect changed images
        id: matrix
        run: |
          list_all_images() {
            if [ -d images ] && [ -n "$(ls -A images 2>/dev/null)" ]; then
              find images -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rc '[., inputs]'
            else
              echo '[]'
            fi
          }

          if [ -n "${{ inputs.image }}" ]; then
            images='["${{ inputs.image }}"]'
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            images=$(list_all_images)
          else
            if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
              images=$(list_all_images)
            else
              changed=$(git diff --name-only HEAD~1 -- 'images/' '.github/workflows/build.yaml')

              if echo "$changed" | grep -qE '\.github/workflows/build\.yaml'; then
                images=$(list_all_images)
              else
                images=$(echo "$changed" | grep -oP 'images/\K[^/]+' | sort -u | jq -Rc '[., inputs]')
              fi
            fi
          fi

          echo "images=${images}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Extract version
        id: version
        run: |
          raw=$(grep -oP 'ARG \w+_VERSION=\K[^\s]+' images/${{ matrix.image }}/Dockerfile | head -1)
          version=$(echo "${raw#v}" | grep -oP '^\d+\.\d+\.\d+')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
