name: Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build.yaml'
      - '.github/workflows/image-build.yaml'
      - '.github/scripts/**'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to build (e.g. pocket-id), or leave empty for all'
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      # Triggers exclude ci.yaml: it gates PR checks but does not affect published artifacts
      - name: Detect changed images
        id: changed
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          WORKFLOW_DISPATCH_IMAGE: ${{ inputs.image }}
        run: bash .github/scripts/detect-images.sh '.github/workflows/build.yaml,.github/workflows/image-build.yaml,.github/scripts/detect-images.sh'

  build:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      image: ${{ matrix.image }}
      mode: release
