repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ['-w', '-s', '-i', '2', '-ci', '-sr']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.17.0
    hooks:
      - id: renovate-config-validator

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['--strict']

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies:
          - prettier@3.9.6
        types_or: [yaml, markdown, json]
        files: \.(ya?ml|md|json5?)$

      - id: lint-renovate-annotations
        name: lint renovate annotations
        entry: .github/scripts/lint-renovate-annotations.sh
        language: script
        files: (^|/)Dockerfile$

      - id: render-image-table
        name: render image table
        entry: .github/scripts/render-image-table.sh
        language: script
        files: ^(README\.md|images/.*/image\.yaml|\.github/scripts/render-image-table\.sh)$
        pass_filenames: false
