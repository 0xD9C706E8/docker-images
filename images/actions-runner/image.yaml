upstream: https://github.com/actions/runner
base: debian-slim
description: Rootless GitHub Actions self-hosted runner with aqua-managed on-demand tooling and remote BuildKit
license: MIT
buildArgs:
  amd64:
    ACTIONS_RUNNER_ARCH: x64
    ACTIONS_RUNNER_SHA256: 04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d
    AQUA_SHA256: 89cb081adb19e425b1dca6b16d912c349a43535ce88d8713050738c9263618d0
  arm64:
    ACTIONS_RUNNER_ARCH: arm64
    ACTIONS_RUNNER_SHA256: 58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1
    AQUA_SHA256: a6b485fc465cd9317a2d8421bd145d4364606690fa49840347eca9ec84223fa9
checksums:
  - upstream: actions/runner
    assets:
      - pattern: actions-runner-linux-{arch}-{version}.tar.gz
        arg: ACTIONS_RUNNER_SHA256
        arch_map:
          amd64: x64
          arm64: arm64
        dockerfile: true
  - upstream: aquaproj/aqua
    source: checksums_file
    checksums_file: aqua_{version}_checksums.txt
    assets:
      - pattern: aqua_linux_{arch}.tar.gz
        arg: AQUA_SHA256
