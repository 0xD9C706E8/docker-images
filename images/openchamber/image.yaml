upstream: https://github.com/openchamber/openchamber
base: node (debian)
description: OpenChamber web UI for OpenCode with aqua-managed CLI toolchain and remote BuildKit client
license: MIT
buildArgs:
  amd64:
    AQUA_SHA256: 89cb081adb19e425b1dca6b16d912c349a43535ce88d8713050738c9263618d0
  arm64:
    AQUA_SHA256: a6b485fc465cd9317a2d8421bd145d4364606690fa49840347eca9ec84223fa9
checksums:
  - upstream: aquaproj/aqua
    source: checksums_file
    checksums_file: aqua_{version}_checksums.txt
    assets:
      - pattern: aqua_linux_{arch}.tar.gz
        arg: AQUA_SHA256
